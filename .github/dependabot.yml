version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vitest*"
          - "@vitejs/*"
      production-dependencies:
        patterns:
          - "react*"
          - "zustand"
          - "dexie"
          - "zustand"
      capacitor:
        patterns:
          - "@capacitor/*"

